name: pull-request

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check server Bash syntax
        run: bash tests/integration/server/verify-shell-syntax.sh
      - name: Test AliDNS hooks
        run: python3 -B tests/integration/server/test_alidns_dns_hook.py
      - name: Check server deployment contract
        shell: pwsh
        run: ./tests/integration/server/verify-static.ps1

  backend:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      MAIL_SUITE_TEST_DATABASE_URL: postgres://mail_suite:ci-${{ github.run_id }}@127.0.0.1:5432/mail_suite?sslmode=disable
      MAIL_SUITE_TEST_API_BINARY: ${{ github.workspace }}/.tmp/bin/api
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: mail_suite
          POSTGRES_USER: mail_suite
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail_suite -d mail_suite"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./src/backend ./tests)"
      - name: Check generated PostgreSQL queries
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          test -z "$(git status --porcelain --untracked-files=all -- src/backend/internal/data/postgres/generated)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Build processes
        run: |
          mkdir -p .tmp/bin
          go build -o .tmp/bin/api ./src/backend/cmd/api
          go build -o .tmp/bin/worker ./src/backend/cmd/worker
          go build -o .tmp/bin/migrator ./src/backend/cmd/migrator
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Enable locked package manager
        run: corepack enable
      - name: Install
        run: pnpm --dir src/web install --frozen-lockfile
      - name: Format
        run: pnpm --dir src/web run format:check
      - name: Lint
        run: pnpm --dir src/web run lint
      - name: Type check
        run: pnpm --dir src/web run typecheck
      - name: Unit test
        run: pnpm --dir src/web test
      - name: Contract
        run: pnpm --dir src/web run contract
      - name: Build
        run: pnpm --dir src/web run build
      - name: Production dependency licenses
        run: pnpm --dir src/web licenses list --prod
      - name: Production dependency audit
        run: pnpm --dir src/web audit --prod --audit-level high
      - name: Install Chromium
        run: pnpm --dir src/web run e2e:install
      - name: End-to-end test
        run: pnpm --dir src/web run e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            .tmp/playwright-results
            .tmp/playwright-report
          if-no-files-found: ignore

  oci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api
          - worker
          - migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/Dockerfile
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=ci
            REVISION=${{ github.sha }}

  web-oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/web/Dockerfile
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
