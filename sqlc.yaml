version: "2"

sql:
  - engine: postgresql
    schema: src/backend/migrations
    queries: src/backend/internal/data/postgres/query
    gen:
      go:
        package: generated
        out: src/backend/internal/data/postgres/generated
        sql_package: pgx/v5
        emit_db_tags: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
